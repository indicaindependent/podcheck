<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" role="img" aria-labelledby="trs drs" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="trs">Three rejection shapes from the state short-link service</title>
<desc id="drs">The state short-link service rejects in three distinguishable shapes, and PodCheck maps each to a different user-facing outcome instead of collapsing them into one failure. An HTTP 500 carrying Invalid signet ID means the code is not a state registry code; this shape was confirmed live on 2026-09-07. An HTTP 404 carrying Code not issued with a batch id and index means a real package tag whose unit number was never issued. An HTTP 404 carrying not found means the package is unknown.</desc>
<rect width="1240" height="400" fill="#0B1015"/>
<text x="72" y="54" fill="#F3F7F9" font-size="26" font-weight="600">Why three &#8220;no&#8221;s are not one &#8220;no&#8221;</text>
<text x="72" y="86" fill="#A7B6C2" font-size="15">Collapsing these would throw away the only diagnostic the user has.</text>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#A7B6C2" stroke="#A7B6C2" stroke-width="1"/></marker></defs>
<rect x="72" y="122" width="1096" height="72" rx="8" fill="#161E27" stroke="#A7B6C2" stroke-width="1.5"/>
<rect x="92" y="141" width="74" height="34" rx="6" fill="#1E2833" stroke="#F5A524" stroke-width="1.5"/>
<text x="129" y="164" fill="#F5A524" font-size="17" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">500</text>
<text x="188" y="155" fill="#F3F7F9" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Invalid signet ID</text>
<text x="188" y="177" fill="#A7B6C2" font-size="13">CONFIRMED LIVE 2026-09-07</text>
<line x1="720" y1="158" x2="776" y2="158" stroke="#A7B6C2" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="1148" y="164" fill="#F5A524" font-size="16" font-weight="600" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">not_state_registry</text>
<rect x="72" y="206" width="1096" height="72" rx="8" fill="#161E27" stroke="#A7B6C2" stroke-width="1.5"/>
<rect x="92" y="225" width="74" height="34" rx="6" fill="#1E2833" stroke="#FB7185" stroke-width="1.5"/>
<text x="129" y="248" fill="#FB7185" font-size="17" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">404</text>
<text x="188" y="239" fill="#F3F7F9" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Code not issued  (+ batchId, index)</text>
<text x="188" y="261" fill="#A7B6C2" font-size="13">documented</text>
<line x1="720" y1="242" x2="776" y2="242" stroke="#A7B6C2" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="1148" y="248" fill="#FB7185" font-size="16" font-weight="600" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">unit_not_issued</text>
<rect x="72" y="290" width="1096" height="72" rx="8" fill="#161E27" stroke="#A7B6C2" stroke-width="1.5"/>
<rect x="92" y="309" width="74" height="34" rx="6" fill="#1E2833" stroke="#FB7185" stroke-width="1.5"/>
<text x="129" y="332" fill="#FB7185" font-size="17" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">404</text>
<text x="188" y="323" fill="#F3F7F9" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">not found</text>
<text x="188" y="345" fill="#A7B6C2" font-size="13">documented</text>
<line x1="720" y1="326" x2="776" y2="326" stroke="#A7B6C2" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="1148" y="332" fill="#FB7185" font-size="16" font-weight="600" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">package_unknown</text>
</svg>
