<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 752" width="1240" height="752" role="img" aria-labelledby="tom dom" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="tom">PodCheck registry outcomes: seven distinct answers, not pass or fail</title>
<desc id="dom">A vertical list of the seven registry outcomes PodCheck returns. Verified means the state registry holds the unit. Two outcomes mean the state says no in a way that matters: a real package tag with a unit number never issued, and a package the registry has never seen. Three mean the code or link was bad and should be rescanned. One means the registry was unreachable, which is explicitly not evidence either way.</desc>
<rect width="1240" height="752" fill="#0B1015"/>
<text x="72" y="56" fill="#F3F7F9" font-size="26" font-weight="600">Seven answers, not two</text>
<text x="72" y="88" fill="#A7B6C2" font-size="15">A failed scan is not proof of a counterfeit. The app tells the user WHICH kind of no it is.</text>
<rect x="72" y="108" width="1096" height="1" fill="#A7B6C2"/>
<rect x="72" y="138" width="1096" height="62" rx="8" fill="#161E27" stroke="#A7B6C2" stroke-width="1.5"/>
<rect x="72" y="138" width="7" height="62" rx="3.5" fill="#4ADE80" stroke="#4ADE80" stroke-width="1"/>
<text x="100" y="164" fill="#4ADE80" font-size="16" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">verified</text>
<text x="1156" y="164" fill="#F3F7F9" font-size="15" text-anchor="end">The registry has the unit</text>
<rect x="72" y="212" width="1096" height="62" rx="8" fill="#161E27" stroke="#A7B6C2" stroke-width="1.5"/>
<rect x="72" y="212" width="7" height="62" rx="3.5" fill="#FB7185" stroke="#FB7185" stroke-width="1"/>
<text x="100" y="238" fill="#FB7185" font-size="16" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">unit_not_issued</text>
<text x="1156" y="238" fill="#F3F7F9" font-size="15" text-anchor="end">Real package tag, unit number never issued</text>
<rect x="72" y="286" width="1096" height="62" rx="8" fill="#161E27" stroke="#A7B6C2" stroke-width="1.5"/>
<rect x="72" y="286" width="7" height="62" rx="3.5" fill="#FB7185" stroke="#FB7185" stroke-width="1"/>
<text x="100" y="312" fill="#FB7185" font-size="16" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">package_unknown</text>
<text x="1156" y="312" fill="#F3F7F9" font-size="15" text-anchor="end">The registry has never seen this package</text>
<rect x="72" y="360" width="1096" height="62" rx="8" fill="#161E27" stroke="#A7B6C2" stroke-width="1.5"/>
<rect x="72" y="360" width="7" height="62" rx="3.5" fill="#F5A524" stroke="#F5A524" stroke-width="1"/>
<text x="100" y="386" fill="#F5A524" font-size="16" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">not_state_registry</text>
<text x="1156" y="386" fill="#F3F7F9" font-size="15" text-anchor="end">Not a state registry code at all</text>
<rect x="72" y="434" width="1096" height="62" rx="8" fill="#161E27" stroke="#A7B6C2" stroke-width="1.5"/>
<rect x="72" y="434" width="7" height="62" rx="3.5" fill="#F5A524" stroke="#F5A524" stroke-width="1"/>
<text x="100" y="460" fill="#F5A524" font-size="16" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">malformed_retail_id</text>
<text x="1156" y="460" fill="#F3F7F9" font-size="15" text-anchor="end">Not a valid Retail ID. Usually a misread</text>
<rect x="72" y="508" width="1096" height="62" rx="8" fill="#161E27" stroke="#A7B6C2" stroke-width="1.5"/>
<rect x="72" y="508" width="7" height="62" rx="3.5" fill="#F5A524" stroke="#F5A524" stroke-width="1"/>
<text x="100" y="534" fill="#F5A524" font-size="16" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">signet_unresolved</text>
<text x="1156" y="534" fill="#F3F7F9" font-size="15" text-anchor="end">Short link would not resolve</text>
<rect x="72" y="582" width="1096" height="62" rx="8" fill="#161E27" stroke="#A7B6C2" stroke-width="1.5"/>
<rect x="72" y="582" width="7" height="62" rx="3.5" fill="#A7B6C2" stroke="#A7B6C2" stroke-width="1"/>
<text x="100" y="608" fill="#A7B6C2" font-size="16" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">registry_error / fetch_error</text>
<text x="1156" y="608" fill="#F3F7F9" font-size="15" text-anchor="end">Unreachable. NOT evidence either way</text>
<text x="72" y="686" fill="#A7B6C2" font-size="14">Legend: green the state confirms it. red the state says no in a way that matters. amber the input was bad, rescan. grey no answer, not evidence.</text>
</svg>
