<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 926" width="1240" height="926" role="img" aria-labelledby="tfc dfc" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="tfc">PodCheck v2.0 scoring: nine deterministic factors, no image guessing</title>
<desc id="dfc">A horizontal bar chart of the nine factors PodCheck scores, sorted by weight, summing to exactly 100. The state registry lookup carries 35. Four factors totalling 29 are answers you give about the physical package. Two totalling 20 are text matches against turn's own published catalogue and barcodes. One worth 12 reads the compliance panel from a photo. One worth 4 is a live California licence lookup. Colour encodes where each factor's evidence comes from. A stacked summary bar at the bottom shows the same five sources.</desc>
<rect width="1240" height="926" fill="#0B1015"/>
<text x="72" y="56" fill="#F3F7F9" font-size="26" font-weight="600">What PodCheck actually scores</text>
<text x="72" y="88" fill="#A7B6C2" font-size="15">Nine deterministic factors. No model judges the photos - every factor is a lookup, a text match, or something you tell it.</text>
<text x="72" y="112" fill="#A7B6C2" font-size="15">Factors that cannot apply to a product are left OUT of the denominator, never scored zero.</text>
<rect x="72" y="132" width="1096" height="1" fill="#A7B6C2"/>
