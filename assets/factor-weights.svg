<text x="72" y="222" fill="#A7B6C2" font-size="13">Metrc Retail ID resolved server-side (NY/CA)</text>
<text x="1168" y="199" fill="#2DD4E8" font-size="14" text-anchor="end">state registry</text>
<text x="72" y="260" fill="#F3F7F9" font-size="15" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">inside</text>
<rect x="248" y="242" width="232" height="26" rx="4" fill="#4ADE80" stroke="#4ADE80" stroke-width="1.5"/>
<text x="492" y="261" fill="#4ADE80" font-size="15" font-weight="600">12</text>
<text x="72" y="284" fill="#A7B6C2" font-size="13">inside foil carries turn's logo pattern</text>
<text x="1168" y="261" fill="#4ADE80" font-size="14" text-anchor="end">you report</text>
