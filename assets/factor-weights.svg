<text x="72" y="886" fill="#A7B6C2" font-size="14">Total 100. Verdict bands: likely_authentic / could_not_verify / signs_of_counterfeit, plus a lean hint when too little was measured.</text>
<text x="72" y="910" fill="#A7B6C2" font-size="14">A low score is NOT proof of a counterfeit, and PodCheck is not affiliated with turn.</text>
