<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="tfw dfw" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="tfw">PodCheck scoring: nine factors, weights summing to 100</title>
<desc id="dfw">A horizontal bar chart of the nine factors PodCheck scores, sorted by weight. Code destination, the state track-and-trace registry lookup, carries the largest weight at 35 of 100. Compliance label OCR and inside-of-the-pouch carry 12 each. Barcode and catalog checks carry 10 each. Sticker position carries 8, pouch artwork 5, seller licence 4 and purchase context 4. The weights total exactly 100. Colour encodes where each factor's evidence comes from. Three factors apply to pouch products only and are excluded from the denominator, never scored zero, when the product is not a pouch. Four hard signals cap the total score regardless of the other factors.</desc>
<rect width="1200" height="620" fill="#0B1015"/>
<text x="64" y="52" fill="#F3F7F9" font-size="25" font-weight="600">Nine factors, weight 100</text>
<text x="64" y="82" fill="#A7B6C2" font-size="15">No model judges the photos. Every factor is a registry lookup, a text match against published data, or an answer the user gives.</text>
<text x="436" y="139" fill="#F3F7F9" font-size="15" text-anchor="end">Code destination (state registry QR)</text>
