<rect x="842" y="516" width="13" height="13" rx="3" fill="#4ADE80" stroke="#4ADE80" stroke-width="1"/>
<text x="862" y="527" fill="#A7B6C2" font-size="13">public licence search</text>
<rect x="64" y="550" width="1072" height="76" rx="8" fill="#1E2833" stroke="#F5A524" stroke-width="2"/>
<text x="86" y="576" fill="#F5A524" font-size="14" font-weight="600">HARD SIGNALS CAP THE SCORE</text>
<text x="86" y="600" fill="#F3F7F9" font-size="13.5">Plain foil inside the pouch -&gt; 40   Sticker on the front -&gt; 44   Barcode belongs to another flavor -&gt; 30   Artwork shows the wrong device -&gt; 44</text>
<text x="86" y="618" fill="#A7B6C2" font-size="12.5">Factors that cannot apply to a product are excluded from the denominator, never scored zero.</text>
</svg>
